### Most important messages

tempchannel-panel-title: "%owner% المحادثة الخاصة لـ"
tempchannel-panel-body: |
  أهلاً %owner% في محادثتك الخاصة!
  يمكن فقط للمستخدمين المتصلين في القناة رؤية المحادثة الخاصة بك. يُرجى ملاحظة أنه سيتم حذف القناة إذا غادر جميع المستخدمين

  حالة القناة الصوتية :
  - %private%
  - %hidden%
  
  استخدم أحد **الرموز** التالية أدناه **لتعديل** ميزات قناتك الصوتية

bot-added-title: شكرا لإضافتي !
bot-added-body: |
  اهلاّ, شكرا لإضافتي الى خادمك!
  
  اكتب `v/help` لعرض جميع الأوامر
  
  للبدء، اكتب `prefix%setup%` للوصول إلى إعدادات الإرشاد

  هنا بعض الروابط التي قد تكون مفيدة:
  - [لوحة التحكم ](https://dashboard.empymanager.com/)
  - [ الدعم الفني ](https://empymanager.com/support)
  - [ التعليمات ](https://docs.empymanager.com/)
  - [ انشاء قناة مؤقتة ](https://docs.empymanager.com/getting-started/create-temporary-channels)

setup-title: "✅ تم انشاء القناة الرئيسية"
setup-body: |
  ✅ تم إنشاء **القناة الرئيسية** بالمعرّف `%id%`

  يمكن للمستخدمين الآن إنشاء القنوات المؤقتة الخاصة بهم من خلال القناة الرئيسية

  يُرجى التأكد من تخصيص إعداداتك مثل اسم القناة، معدل البت، الصلاحيات، وحد المستخدمين
  
  **جميع القنوات المؤقتة ستكتسب إعدادات الصلاحيات ومعدل البت الخاصة بالقناة الرئيسية**
  
  🌐 **لوحة التحكم**
  - [إعدادات القنوات](https://dashboard.empymanager.com/guilds/%guildId%/masters/%id%)
  - [إعدادات الخادم](https://dashboard.empymanager.com/guilds/%guildId%)
  
  ⌨️ **الأوامر*
  - [قائمة االأوامرر](https://docs.empymanager.com/commands)
  
error-master-creation-body: |
  حدث خطأ أثناء إنشاء القناة الرئيسية:
  ```%error%```
  
  **يُرجى التأكد من أن البوت (EmpyManager) يمتلك الأذونات الكافية** (يتطلب تفعيل إذن مسؤول لإنشاء قناة رئيسية)
  
  **[الدعم الفني](https://empymanager.com/support) للحصول على المساعدة.**

  
help-title: (EmpyManager) أوامر البوت
help-body: |
  🌟 `v/premium` - للأشتراك في البوت والحصول على ميزات إضافية
  
  -
help-control-subtitle: 🛠️   تحكم في قناتك الصوتية
help-control-body: |
  -
  
  🚫 `/private` / 🌐 `/public` - لجعل القناة الصوتية خاصة أو عامة
  
  👻 `/hide` / 👁 `/show` - لإخفاء أو إظهار القناة الصوتية

  🏠 `/waitingroom` - إضافة غرفة انتظار للقناة الصوتية
  
  🚩 `/claim` - أخذ ملكية القناة الصوتية الحالية (يجب ألا يكون المالك متصلاً)
  
  👞 `/kick @user` / ⛔ `/ban @user` -  طرد أو حظر عضو من القناة الصوتية
  
  🔗 `/invite @user` - دعوة شخص إلى قناتك الصوتية (سيتلقى المدعو رسالة دعوة)

  أوامر أخرى: `/rename`, `/limit`, `/bitrate`.
  
  **إذا لم تتمكن من استخدام أوامر الـ /، يُرجى التواصل مع مشرف [تحديث صلاحيات البوت](https://discord.com/oauth2/authorize?client_id=719236419230367798&permissions=381715218393%20&scope=bot%20applications.commands&guild_id=%guildId%).**

help-settings-subtitle: ⚙️  إعدادات الإدارة
help-settings-body: |
  - خاص بالإدارة فقط -
  📒 `v/setup` - إنشاء قناة رئيسية جديدة وإعدادها
  
  🖥 `v/dashboard` - الوصول إلى لوحة التحكم
  
  📜 `v/masterlist` - عرض قائمة القنوات الرئيسية
  
  ❌ `v/resetmasters` - تحويل جميع القنوات الرئيسية إلى قنوات عادية
  
  ♻️ `v/refresh` - تحديث كافة الإعدادات من قاعدة البيانات في حالة حدوث خلل
  
  🔧 `v/settings` - عرض جميع الإعدادات المتقدمة

